<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>TransitKey - Select Route</title>
    <style>body { font-family: 'Baloo 2', sans-serif; }</style>
  </head>
  <body class="bg-[#F0F4FF] min-h-screen">

    <!-- ============ DESKTOP MAIN ============ -->
    <main id="route-desktop-main" class="hidden md:block min-h-screen bg-[#F0F4FF] px-16 py-8">
      <div class="max-w-4xl mx-auto flex flex-col gap-6">

        <div class="flex items-center gap-3">
          <a href="./passenger-dashboard.html" id="route-desktop-back-link" class="text-[#2563EB]">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
            </svg>
          </a>
          <h2 class="text-xl font-black text-gray-900">Select Route</h2>
        </div>

        <!-- Search box -->
        <div class="bg-white rounded-2xl p-5 shadow-sm flex flex-col gap-3">
          <div class="flex items-center gap-3 border border-gray-200 rounded-xl px-4 py-3 bg-gray-50">
            <svg class="w-4 h-4 text-[#2563EB] flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-2.083 3.203-4.512 3.203-7.327a8.5 8.5 0 10-17 0c0 2.815 1.26 5.244 3.203 7.327a19.58 19.58 0 002.683 2.282 16.975 16.975 0 001.144.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
            <p id="route-desktop-from-text" class="text-gray-700 text-sm">Yaba, Lagos</p>
          </div>
          <div class="flex items-center gap-3 border border-gray-200 rounded-xl px-4 py-3 bg-gray-50">
            <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v1.5M3 21v-6m0 0l2.77-.693a9 9 0 016.208.682l.108.054a9 9 0 006.086.71l3.114-.732a48.524 48.524 0 01-.005-10.499l-3.11.732a9 9 0 01-6.085-.711l-.108-.054a9 9 0 00-6.208-.682L3 4.5M3 15V4.5"/></svg>
            <p id="route-desktop-to-text" class="text-gray-700 text-sm">Ibadan</p>
          </div>
        </div>

        <!-- Available Buses heading -->
        <div class="flex items-center justify-between">
          <h3 class="font-bold text-lg text-gray-900">Available Buses</h3>
          <span id="route-desktop-count-badge" class="bg-blue-100 text-[#2563EB] text-sm font-bold px-3 py-1 rounded-full">3 Found</span>
        </div>

        <!-- Bus cards container -->
        <div id="route-desktop-bus-list" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>

      </div>
    </main>

    <!-- ============ MOBILE MAIN ============ -->
    <main id="route-mobile-main" class="flex md:hidden flex-col min-h-screen pb-20">

      <!-- Header -->
      <div class="flex items-center gap-3 px-4 py-3 bg-white border-b border-gray-100">
        <a href="./passenger-dashboard.html" id="route-mobile-back-link" class="text-[#2563EB]">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/>
          </svg>
        </a>
        <h2 class="font-bold text-[#2563EB]">Select Route</h2>
        <div class="ml-auto flex items-center gap-3">
          <svg class="w-5 h-5 text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
          <svg class="w-5 h-5 text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 22.5a3 3 0 003-3v-8.174l-6.879-4.022M3.75 21.75V12m0 0l8.25-4.5L12 6.75M3.75 12h16.5"/></svg>
        </div>
      </div>

      <!-- Search box -->
      <div class="mx-4 mt-3 bg-white rounded-2xl p-4 shadow-sm flex flex-col gap-2 relative">
        <div class="flex items-center gap-3 border border-gray-200 rounded-xl px-3 py-2.5 bg-gray-50">
          <svg class="w-4 h-4 text-[#2563EB] flex-shrink-0" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M11.54 22.351l.07.04.028.016a.76.76 0 00.723 0l.028-.015.071-.041a16.975 16.975 0 001.144-.742 19.58 19.58 0 002.683-2.282c1.944-2.083 3.203-4.512 3.203-7.327a8.5 8.5 0 10-17 0c0 2.815 1.26 5.244 3.203 7.327a19.58 19.58 0 002.683 2.282 16.975 16.975 0 001.144.742zM12 13.5a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
          <p id="route-mobile-from-text" class="text-gray-700 text-sm">Yaba, Lagos</p>
        </div>
        <div class="flex justify-center -my-1 z-10">
          <button id="route-mobile-swap-btn" class="w-7 h-7 bg-white border border-gray-200 rounded-full flex items-center justify-center shadow-sm">
            <svg class="w-4 h-4 text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5"/></svg>
          </button>
        </div>
        <div class="flex items-center gap-3 border border-gray-200 rounded-xl px-3 py-2.5 bg-gray-50">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 3v1.5M3 21v-6m0 0l2.77-.693a9 9 0 016.208.682l.108.054a9 9 0 006.086.71l3.114-.732a48.524 48.524 0 01-.005-10.499l-3.11.732a9 9 0 01-6.085-.711l-.108-.054a9 9 0 00-6.208-.682L3 4.5M3 15V4.5"/></svg>
          <p id="route-mobile-to-text" class="text-gray-700 text-sm">Ibadan</p>
        </div>
      </div>

      <!-- Available Buses heading -->
      <div class="mx-4 mt-5 flex items-center justify-between">
        <p class="font-bold text-gray-900">Available Buses</p>
        <span id="route-mobile-count-badge" class="bg-blue-100 text-[#2563EB] text-xs font-bold px-3 py-1 rounded-full">3 Found</span>
      </div>

      <!-- Bus cards -->
      <div id="route-mobile-bus-list" class="mx-4 mt-3 flex flex-col gap-4"></div>
    </main>

    <!-- BOTTOM NAV (mobile only) -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-2 py-2 flex justify-around z-50">
      <a href="./passenger-dashboard.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        <span class="text-xs">Home</span>
      </a>
      <a href="./passenger-route.html" class="flex flex-col items-center gap-0.5 text-[#2563EB]">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5"/></svg>
        <span class="text-xs font-semibold">Route</span>
      </a>
      <a href="./passenger-trip-details.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
        <span class="text-xs">Trips</span>
      </a>
      <a href="./passenger-live-tracking.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503-10.498l4.875 2.438M9 3l-4.875 2.438-4.875-2.438M9 3L4.125 5.438M9 3l4.875 2.438M14.625 5.438L9 8.25M4.125 5.438L9 8.25"/></svg>
        <span class="text-xs">Map</span>
      </a>
    </nav>

    <script type="module" src="./passenger-route.js"></script>
  </body>
</html>
