<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TransitKey - Live Tracking</title>
    <style>body { font-family: 'Inter', system-ui, sans-serif; }</style>
  </head>
  <body class="bg-white min-h-screen">

    <!-- ============ DESKTOP MAIN ============ -->
    <main id="live-desktop-main" class="hidden md:block min-h-screen bg-[#F0F4FF] px-16 py-8">
      <div class="max-w-3xl mx-auto flex flex-col gap-6">

        <div class="flex items-center gap-3">
          <a href="./passenger-trip-details.html" class="text-[#2563EB]">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          </a>
          <h2 class="text-xl font-black text-gray-900">Live Tracking</h2>
        </div>

        <!-- Map -->
        <div class="relative h-96 rounded-2xl overflow-hidden bg-gray-200">
          <img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=1200&auto=format&fit=crop" alt="Aerial road view" class="w-full h-full object-cover" />
          <button id="live-desktop-locate-btn" class="absolute bottom-4 right-4 w-11 h-11 bg-white rounded-xl shadow-md flex items-center justify-center">
            <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
          </button>
        </div>

        <!-- Status card -->
        <div class="bg-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
          <div>
            <p class="font-bold text-gray-900">Lagos to Ibadan</p>
            <p class="text-sm text-gray-500">Status: On Schedule</p>
          </div>
          <div class="text-right">
            <p class="text-2xl font-black text-[#2563EB]">12 mins</p>
            <p class="text-xs text-gray-500 uppercase tracking-wide">Arrival</p>
          </div>
        </div>

        <!-- Driver + bus -->
        <div class="grid grid-cols-2 gap-4">
          <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-3">
            <div class="w-12 h-12 rounded-full overflow-hidden bg-gray-200">
              <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=100&auto=format&fit=crop&face" alt="Driver" class="w-full h-full object-cover" />
            </div>
            <div>
              <p class="font-bold text-gray-900 text-sm">Adewale Musa</p>
              <p class="text-xs text-gray-500">⭐ Top Rated Driver</p>
            </div>
          </div>
          <div class="bg-white rounded-2xl p-4 shadow-sm flex items-center gap-3">
            <div class="w-12 h-12 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-6 h-6 text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
            </div>
            <div>
              <p class="font-bold text-gray-900 text-sm">LND 472 YK</p>
              <p class="text-xs text-gray-500">Volvo Marcopolo</p>
            </div>
          </div>
        </div>

        <!-- Action row -->
        <div class="grid grid-cols-3 gap-4">
          <button id="live-desktop-emergency-btn" class="bg-red-50 text-red-600 font-semibold py-3 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd"/></svg>
            Emergency Help
          </button>
          <button id="live-desktop-report-btn" class="bg-gray-100 text-gray-700 font-semibold py-3 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd"/></svg>
            Report Issue
          </button>
          <button id="live-desktop-share-btn" class="bg-blue-50 text-[#2563EB] font-semibold py-3 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>
            Share Location
          </button>
        </div>
      </div>
    </main>

    <!-- ============ MOBILE MAIN ============ -->
    <main id="live-mobile-main" class="flex md:hidden flex-col min-h-screen relative">

      <!-- Full bleed map -->
      <div class="relative h-[60vh] bg-gray-200">
        <img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?w=900&auto=format&fit=crop" alt="Aerial road view" class="w-full h-full object-cover" />

        <!-- Top floating bar -->
        <div class="absolute top-4 left-4 right-4 bg-white rounded-full shadow-md flex items-center justify-between px-4 py-3">
          <a href="./passenger-trip-details.html" class="text-gray-700">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18"/></svg>
          </a>
          <p class="font-bold text-gray-900">Live Tracking</p>
          <button class="text-gray-700">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 12.75a.75.75 0 110-1.5.75.75 0 010 1.5zM12 18.75a.75.75 0 110-1.5.75.75 0 010 1.5z"/></svg>
          </button>
        </div>

        <!-- Locate button -->
        <button id="live-mobile-locate-btn" class="absolute bottom-4 right-4 w-11 h-11 bg-white rounded-xl shadow-md flex items-center justify-center">
          <svg class="w-5 h-5 text-gray-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"/></svg>
        </button>
      </div>

      <!-- Bottom sheet -->
      <div class="flex-1 bg-white rounded-t-3xl -mt-5 relative px-5 pt-5 pb-6 flex flex-col gap-4">
        <div class="w-10 h-1 bg-gray-300 rounded-full mx-auto"></div>

        <div class="flex items-center justify-between">
          <div>
            <p class="font-bold text-gray-900">Lagos to Ibadan</p>
            <p class="text-sm text-gray-500">Status: On Schedule</p>
          </div>
          <div class="text-right">
            <p class="text-2xl font-black text-[#2563EB]">12 mins</p>
            <p class="text-xs text-gray-500 uppercase tracking-wide">Arrival</p>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div class="border border-gray-200 rounded-xl p-3 flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-full overflow-hidden bg-gray-200 flex-shrink-0">
              <img src="https://images.unsplash.com/photo-1568602471122-7832951cc4c5?w=100&auto=format&fit=crop&face" alt="Driver" class="w-full h-full object-cover" />
            </div>
            <div>
              <p class="font-bold text-gray-900 text-xs">Adewale Musa</p>
              <p class="text-xs text-gray-500">⭐ Top Rated</p>
            </div>
          </div>
          <div class="border border-gray-200 rounded-xl p-3 flex items-center gap-2.5">
            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0">
              <svg class="w-5 h-5 text-[#2563EB]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
            </div>
            <div>
              <p class="font-bold text-gray-900 text-xs">LND 472 YK</p>
              <p class="text-xs text-gray-500">Volvo Marcopolo</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-3 gap-2">
          <button id="live-mobile-emergency-btn" class="bg-red-50 text-red-600 font-semibold py-2.5 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M9.401 3.003c1.155-2 4.043-2 5.197 0l7.355 12.748c1.154 2-.29 4.5-2.599 4.5H4.645c-2.309 0-3.752-2.5-2.598-4.5L9.4 3.003zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd"/></svg>
            Emergency Help
          </button>
          <button id="live-mobile-report-btn" class="bg-gray-100 text-gray-700 font-semibold py-2.5 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" d="M2.25 12c0-5.385 4.365-9.75 9.75-9.75s9.75 4.365 9.75 9.75-4.365 9.75-9.75 9.75S2.25 17.385 2.25 12zM12 8.25a.75.75 0 01.75.75v3.75a.75.75 0 01-1.5 0V9a.75.75 0 01.75-.75zm0 8.25a.75.75 0 100-1.5.75.75 0 000 1.5z" clip-rule="evenodd"/></svg>
            Report Issue
          </button>
          <button id="live-mobile-share-btn" class="bg-blue-50 text-[#2563EB] font-semibold py-2.5 rounded-xl flex flex-col items-center gap-1 text-xs">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M7.217 10.907a2.25 2.25 0 100 2.186m0-2.186c.18.324.283.696.283 1.093s-.103.77-.283 1.093m0-2.186l9.566-5.314m-9.566 7.5l9.566 5.314m0 0a2.25 2.25 0 103.935 2.186 2.25 2.25 0 00-3.935-2.186zm0-12.814a2.25 2.25 0 103.933-2.185 2.25 2.25 0 00-3.933 2.185z"/></svg>
            Share Location
          </button>
        </div>
      </div>
    </main>

    <!-- BOTTOM NAV -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 px-2 py-2 flex justify-around z-50">
      <a href="./passenger-dashboard.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12l8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25"/></svg>
        <span class="text-xs">Home</span>
      </a>
      <a href="./passenger-route.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 7.5L7.5 3m0 0L12 7.5M7.5 3v13.5m13.5 0L16.5 21m0 0L12 16.5m4.5 4.5V7.5"/></svg>
        <span class="text-xs">Route</span>
      </a>
      <a href="./passenger-trip-details.html" class="flex flex-col items-center gap-0.5 text-gray-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/></svg>
        <span class="text-xs">Trips</span>
      </a>
      <a href="./passenger-live-tracking.html" class="flex flex-col items-center gap-0.5 text-[#2563EB]">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503-10.498l4.875 2.438M9 3l-4.875 2.438-4.875-2.438M9 3L4.125 5.438M9 3l4.875 2.438M14.625 5.438L9 8.25M4.125 5.438L9 8.25"/></svg>
        <span class="text-xs font-semibold">Map</span>
      </a>
    </nav>

    <script type="module" src="./passenger-live-tracking.js"></script>
  </body>
</html>
