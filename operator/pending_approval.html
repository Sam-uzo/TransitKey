<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transitkey Ops – Application Pending</title>
  <style>
    :root {
      --primary:       #2E3A8C;
      --primary-dark1: #1B2562;
      --accent:        #3B6FE8;
      --accent-hover:  #295CD4;
      --black:         #141414;
      --gray-700:      #3D3D3D;
      --gray-600:      #5C5C5C;
      --gray-500:      #6E6E6E;
      --gray-400:      #8F8F8F;
      --gray-300:      #B8B8B8;
      --gray-200:      #D4D4D4;
      --gray-100:      #E8E8E8;
      --gray-50:       #F5F5F5;
      --white:         #FFFFFF;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--black);
    }

    .pending-container {
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 12px;
      padding: 48px 40px;
      max-width: 480px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    }

    .logo {
      font-size: 26px;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: -0.5px;
      text-decoration: none;
      display: inline-block;
      margin-bottom: 40px;
    }

    .icon-wrapper {
      width: 80px;
      height: 80px;
      background: var(--gray-50);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      border: 2px solid var(--gray-200);
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      color: var(--primary);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--black);
    }

    p {
      font-size: 15px;
      line-height: 1.6;
      color: var(--gray-600);
      margin-bottom: 32px;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--white);
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      padding: 14px 28px;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn:active {
      transform: translateY(1px);
    }
  </style>
</head>
<body>

  <div class="pending-container">
    <a class="logo" href="/">Transitkey</a>
    
    <div class="icon-wrapper">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>

    <h1>Application Under Review</h1>
    
    <p>
      Thank you for registering as an operator with Transitkey. Our team is currently reviewing your application details. This process usually takes 24-48 hours. We will notify you via email as soon as your account is approved.
    </p>

    <a href="/" class="btn">Return to Landing Page</a>
  </div>

  <script src="pending_approval.js"></script>
</body>
</html>
