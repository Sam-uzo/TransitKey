<!doctype html>
<html land="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width = device-width, initial-scale= 1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
  </head>
  <body class="min-h-screen w-full flex flex-col justify-between items-center">
    <header
      class="flex w-full justify-between items-center p-4 px-16 border-b-2 border-gray-300"
    >
      <div><h2 class="font-bold text-[#2563EB] text-xl">TransitKey</h2></div>
      <nav
        class="flex justify-center items-center w-1/2 text-1xl text-gray-700 font-medium gap-4"
      >
        <span><a href="./passenger-home.html" class="hover:underline">Home</a></span>
        <span><a href="./Passenger-route.html" class="hover:underline">Route</a></span>
        <span><a href="./passenger-details.html" class="hover:underline">Details</a></span>
        <span><a href="./passenger-map.html" class="hover:underline">Map</a></span>
        <span><a href="./passenger-report.html" class="hover:underline">Report</a></span>
        <span><a href="./passenger-notification.html" class="hover:underline">Notification</a></span>
        <span><a href="./passenger-profile.html" class="hover:underline">Profile</a></span>
      </nav>
      <div>
        <button class="SignUp-btn bg-[#2563EB] text-white p-2 px-4">Sign-up/Login</button>
      </div>
    </header>

    <main
      class="pb-2 p-8 flex justify-center items-center border-4 border-[#C2C2C2] w-1/3"
    >
      <section class="flex flex-col w-full justify-center gap-4">
        <div>
          <span><h2 class="text-xl font-semibold">Log In</h2></span>
          <span
            ><p class="text-sm font-medium text-[]">
              Access your TransitKey account.
            </p></span
          >
        </div>

        <div>
          <span><p class="font-medium">Email or Phone Number</p></span>
          <span
            ><input
              class="text-sm border-2 w-full p-2 border-[#C2C2C2]"
              type="text"
              placeholder="e.g. name@gmail.com"
          /></span>
        </div>

        <div>
          <span><p class="font-medium">Password</p></span>
          <span
            ><input
              class="text-sm border-2 w-full p-2 border-[#C2C2C2]"
              type="password"
              placeholder="*** *** ***"
          /></span>
        </div>

        <div class="flex flex-col w-full">
          <div class="flex gap-2">
            <span>
              <a href="#" class="text-sm font-medium underline">
                Forgot password?
              </a>
            </span>
          </div>
        </div>

        <div class=" w-full flex flex-col justify-center items-center gap-4">
          <div class="w-full">
            <button class="login-btn p-2 w-full text-white bg-[#2563EB] font-medium">LOGIN</button>
          </div>

          <div class="flex gap-2 w-full justify-center items-center ">
            <span class="w-1/2"><hr class="border-[#C2C2C2] w-full border-1.5" /></span>
            <span class="w-fit"><p class="text-xs text-[#C2C2C2] font-extrabold">OR</p></span>
            <span class="w-1/2"><hr class="border-[#C2C2C2] w-full border-1.5" /></span>
          </div>

          <div class="w-full">
            <button class="p-2 w-full text-black font-medium bg-[#98B5F5]">
              LOGIN WITH GOOGLE
            </button>
          </div>

          <div class="p-4">
            <a href="./index.html" class="text-xs font-medium"
              >Don't have an account? <span class="text-[#2563EB] font-bold">Sign Up.</span></a
            >
          </div>
        </div>
      </section>
    </main>

    <footer
      class="bg-[#C2C2C2] border-t-4 flex justify-end items-center w-full gap-16 px-16 py-1 border-gray-300 text-[#4B5563] text-sm font-normal"
    >
      <div><p>@ 2026 TransitKey. All rights reserved</p></div>
      <div class="flex gap-4">
        <span><a href="#">Privacy Policy</a> </span>
        <span><a href="#">Terms of Service</a></span>
        <span><a href="#">Help Center</a></span>
      </div>
    </footer>

    <script type="module" src="./login.js"></script>

  </body>
</html>
