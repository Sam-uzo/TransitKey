<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transitkey – Driver Login</title>
  <style>
    /* ── DESIGN SYSTEM TOKENS ── */
    :root {
      --primary:        #2E3A8C;
      --primary-dark1:  #1B2562;
      --primary-dark2:  #111A4A;
      --primary-light:  #B0BAE8;

      --accent:         #3B6FE8;
      --accent-light:   #C8D4F8;

      --black:          #141414;
      --gray-600:       #5C5C5C;
      --gray-500:       #6E6E6E;
      --gray-400:       #8F8F8F;
      --gray-300:       #B8B8B8;
      --gray-200:       #D4D4D4;
      --gray-100:       #E8E8E8;
      --white:          #FFFFFF;

      --error:          #EF4B5E;
      --error-dark:     #B91C2C;

      --page-bg:        #F0F2F8;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--page-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--black);
    }

    /* ── NAV ── */
    nav {
      background: var(--white);
      border-bottom: 1px solid var(--gray-100);
      padding: 0 40px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 18px;
      font-weight: 700;
      color: var(--primary-dark1);
      letter-spacing: -0.3px;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 28px;
      list-style: none;
    }

    .nav-links a {
      font-size: 14px;
      color: var(--gray-600);
      text-decoration: none;
      transition: color 0.15s;
    }

    .nav-links a:hover { color: var(--primary); }

    .nav-logo-img { height: 48px; width: auto; object-fit: contain; cursor: pointer; }

    /* ── MAIN ── */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }

    /* ── CARD ── */
    .card {
      background: var(--white);
      border: 1.5px solid var(--accent);
      border-radius: 10px;
      padding: 40px 44px;
      width: 100%;
      max-width: 420px;
    }

    .card h1 {
      font-size: 22px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 8px;
    }

    .card h1 .highlight {
      background: #FACC15;
      padding: 1px 4px;
      border-radius: 3px;
    }

    .card .subtitle {
      font-size: 13px;
      color: var(--gray-600);
      line-height: 1.6;
      margin-bottom: 28px;
    }

    /* ── FORM ── */
    .field { margin-bottom: 18px; }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--black);
      margin-bottom: 6px;
    }

    .field input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      padding: 0 13px;
      font-size: 14px;
      color: var(--black);
      background: var(--white);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .field input::placeholder { color: var(--gray-400); }

    .field input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-light);
    }

    .forgot-link {
      display: block;
      font-size: 13px;
      color: var(--accent);
      text-decoration: underline;
      margin-top: -10px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .forgot-link:hover { color: var(--primary); }

    /* ── LOGIN BUTTON (Large CTA) ── */
    .login-btn {
      width: 100%;
      background: var(--accent);
      color: var(--white);
      border: none;
      border-radius: 6px;
      height: 46px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      text-transform: uppercase;
      transition: background 0.15s;
    }

    .login-btn:hover { background: var(--primary); }
    .login-btn:active { background: var(--primary-dark1); }

    /* ── REGISTER LINK ── */
    .register-row {
      text-align: center;
      margin-top: 18px;
      font-size: 13px;
      color: var(--gray-600);
    }

    .register-row a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .register-row a:hover { text-decoration: underline; }

    /* ── FOOTER ── */
    footer {
      background: var(--white);
      border-top: 1px solid var(--gray-100);
      padding: 16px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: var(--gray-400);
    }

    .footer-links {
      display: flex;
      gap: 22px;
    }

    .footer-links a {
      color: var(--gray-400);
      text-decoration: none;
      transition: color 0.15s;
    }

    .footer-links a:hover { color: var(--gray-600); }

    /* ── RESPONSIVE ── */
    @media (max-width: 640px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .card { padding: 28px 24px; }
      footer { flex-direction: column; gap: 10px; text-align: center; padding: 16px 20px; }
    }
  </style>
</head>
