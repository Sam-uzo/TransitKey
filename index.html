<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>TransitKey</title>
    <style>
      body { font-family: 'Inter', system-ui, sans-serif; }
    </style>
  </head>
  <body>

    <!-- ======================================================
         DESKTOP MAIN (show on md and above, hide on mobile)
         To show desktop: add class "hidden md:flex" to desktop-main
         To show mobile:  add class "flex md:hidden" to mobile-main
    ====================================================== -->

    <!-- DESKTOP MAIN -->
    <main id="desktop-main" class="hidden md:flex min-h-screen w-full bg-[#2563EB] items-center justify-center">
      <div class="flex flex-col items-center gap-4">
        <div class="flex items-center gap-4">
          <!-- Bus SVG icon -->
          <svg class="w-20 h-20 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/>
          </svg>
          <h1 class="text-white font-black text-6xl tracking-wide">TRANSITKEY</h1>
        </div>
      </div>
    </main>

    <!-- MOBILE MAIN -->
    <main id="mobile-main" class="flex md:hidden min-h-screen w-full bg-[#2563EB] items-center justify-center">
      <div class="flex items-center gap-3">
        <!-- Bus SVG icon -->
        <svg class="w-10 h-10 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 18.75a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h6m-9 0H3.375a1.125 1.125 0 01-1.125-1.125V14.25m17.25 4.5a1.5 1.5 0 01-3 0m3 0a1.5 1.5 0 00-3 0m3 0h1.125c.621 0 1.129-.504 1.09-1.124a17.902 17.902 0 00-3.213-9.193 2.056 2.056 0 00-1.58-.86H14.25M16.5 18.75h-2.25m0-11.177v-.958c0-.568-.422-1.048-.987-1.106a48.554 48.554 0 00-10.026 0 1.106 1.106 0 00-.987 1.106v7.635m12-6.677v6.677m0 4.5v-4.5m0 0h-12"/>
        </svg>
        <h1 class="text-white font-black text-3xl tracking-wide">TRANSITKEY</h1>
      </div>
    </main>

    <script type="module" src="./splash.js"></script>
  </body>
</html>
